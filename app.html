<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>/* v137: laddskärm tills ritverktyget är helt klart, så att inga halvfärdiga delar syns (Carl 12/11) */
html.boot::before{content:"Laddar Rita din stallinredning \2026";position:fixed;inset:0;z-index:2147483646;background:#ebe4d4;display:block;text-align:center;padding-top:calc(50vh + 18px);box-sizing:border-box;font:16px/1.2 -apple-system,Segoe UI,sans-serif;color:#1f3328;transition:opacity .35s ease}
html.boot::after{content:"";position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-36px 0 0 -24px;border-radius:50%;border:4px solid #d9ceb8;border-top-color:#23412a;z-index:2147483647;animation:mbootr 1s linear infinite;transition:opacity .35s ease}
html.boot.boot-out::before,html.boot.boot-out::after{opacity:0}
@keyframes mbootr{to{transform:rotate(360deg)}}</style>
<script>(function(){var d=document.documentElement;d.classList.add("boot");var fin=false;function done(){if(fin)return;fin=true;d.classList.add("boot-out");setTimeout(function(){d.classList.remove("boot","boot-out")},380)}
function go(){var f=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();Promise.race([f,new Promise(function(r){setTimeout(r,1500)})]).then(function(){requestAnimationFrame(function(){requestAnimationFrame(done)})})}
if(document.readyState==="complete")setTimeout(go,0);else window.addEventListener("load",go);setTimeout(done,7000)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: myrby-green sidebar carrying the real logo + beige workspace (desktop); green top bar + 5-slot tab bar with centre "+" (phone).
   One primary action per screen, sheets for detail, a 4-step wizard for requests. */
:root{
  --bg:#ebe4d4; --surface:#f6f2ea; --raised:#fdfcfb; --sand:#e2d6bf; --line:#d9ceb8;
  --ink:#1e3932; --ink-2:#4d5f56; --ink-3:#7c8a81;
  --green:#23412a; --green-2:#3b7248; --gold:#e5cb7e; --beige:#edd8bc;
  --side:#23412a; --side-ink:#edd8bc; --side-ink-2:rgba(237,216,188,.62); --side-hi:rgba(237,216,188,.09);
  --on-green:#fdfcfb;
  --ok:#2f7a45; --ok-bg:#dcebd9; --warn:#94600f; --warn-bg:#f3e3bf; --crit:#a3392b; --crit-bg:#f3d9d3; --info:#2d5f7a; --info-bg:#d8e6ee;
  --shadow-1:0 1px 2px rgba(30,57,50,.06),0 2px 8px rgba(30,57,50,.06);
  --shadow-2:0 2px 6px rgba(30,57,50,.08),0 16px 40px -12px rgba(30,57,50,.28);
  --scrim:rgba(20,33,25,.48);
  --f-display:"EB Garamond",Baskerville,"Times New Roman",serif;
  --f-body:Carlito,Calibri,"Segoe UI",Arial,sans-serif;
  --r-s:8px; --r:14px; --r-l:22px;
  color-scheme:light;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
.mob-only{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Logo (real Myrby PNG, tinted through a mask so it works on any surface) */
.logo{display:block;aspect-ratio:255/100;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:26px 16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.side .logo{width:150px;color:var(--side-ink);margin:0 8px 26px}
.navlink{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink-2);font-weight:700;font-size:1rem;position:relative;transition:background .15s,color .15s}
.navlink svg{width:22px;height:22px;flex:none}
.navlink:hover{color:var(--side-ink);background:var(--side-hi)}
.navlink[aria-current="page"]{color:var(--side-ink);background:var(--side-hi)}
.navlink[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.navlink .count{margin-left:auto;background:var(--gold);color:#23412a;font-size:.8rem;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px}
.side .cta{margin:4px 0 18px;justify-content:center}
.side .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-hi);border:0;color:var(--side-ink);text-align:left;width:100%}
.who small{display:block;color:var(--side-ink-2);font-size:.8rem}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#23412a;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display);font-size:1.15rem}

.main{min-width:0;padding-block:36px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.page{max-width:1120px;margin:0 auto;display:grid;gap:40px}
.topline{display:flex;align-items:center;gap:12px;justify-content:space-between}
.searchbtn{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;color:var(--ink-3);flex:0 1 420px;text-align:left;box-shadow:var(--shadow-1)}
.searchbtn kbd{margin-left:auto;font-family:var(--f-body);font-size:.8rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px}

.mtop,.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--side);color:var(--side-ink);padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .logo{width:104px}
  .mtop .icon-btn{margin-left:auto;color:var(--side-ink)}
  .mtop .avatar{width:34px;height:34px;font-size:1rem}
  .main{padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{gap:32px}
  .desk-only{display:none!important}
  .mob-only{display:grid!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--raised) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;text-decoration:none;color:var(--ink-3);font-size:.8rem;font-weight:700;position:relative}
  .tabbar a svg{width:24px;height:24px}
  .tabbar a[aria-current="page"]{color:var(--green)}
  .tabbar .plus{align-self:center}
  .tabbar .plus span{width:52px;height:52px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;box-shadow:var(--shadow-2);margin-top:-18px}
  .tabbar .plus svg{width:26px;height:26px}
  .tabbar .dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#23412a;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
}
.icon-btn{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.icon-btn svg{width:22px;height:22px}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--green);color:var(--on-green);font-weight:700;font-size:.98rem;text-decoration:none;transition:transform .12s var(--ease),filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.gold{background:var(--gold);color:#23412a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn.lg{min-height:56px;font-size:1.05rem;padding:0 28px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.side .btn.gold{color:#23412a}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:var(--sand);color:var(--ink-2)} .chip.gold{background:var(--gold);color:#23412a}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:.9rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.pill[aria-pressed="true"]{background:var(--green);color:var(--on-green);box-shadow:none}
.pill .n{opacity:.7;font-weight:400}

/* ---------- Home ---------- */
.hello h1{font-size:clamp(2.3rem,5vw,3.4rem)}
.hello h1 em{font-style:italic;color:var(--green-2)}
.hello p{margin-top:8px;font-size:1.08rem;color:var(--ink-2)}
.next{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--green);color:var(--beige);min-height:260px;display:grid;align-items:end;box-shadow:var(--shadow-2)}
.next .ph{position:absolute;inset:0;background:var(--green) center/cover no-repeat}
.next .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,38,25,.92) 0%,rgba(20,38,25,.7) 45%,rgba(20,38,25,.15) 100%)}
.next .in{position:relative;padding:32px;display:grid;gap:12px;max-width:560px}
.next .eyebrow{color:var(--gold)}
.next h2{font-size:clamp(1.7rem,3.4vw,2.4rem);color:#fdfcfb}
.next p{color:rgba(237,216,188,.85)}
.next .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.next .btn.ghost{color:#fdfcfb;box-shadow:inset 0 0 0 1.5px rgba(237,216,188,.45)}
@media (max-width:600px){.next{min-height:300px}.next .in{padding:22px}.next .ph::after{background:linear-gradient(0deg,rgba(20,38,25,.95) 10%,rgba(20,38,25,.55) 70%,rgba(20,38,25,.25))}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 150px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-1);text-decoration:none}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:500;line-height:1}
.stat span{font-size:.86rem;color:var(--ink-2);line-height:1.25}
.stat.hot{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow-1)}
.shelf{display:grid;gap:14px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.shelf-head h2{font-size:clamp(1.45rem,2.6vw,1.8rem)}
.shelf-head a,.shelf-head button{font-weight:700;font-size:.88rem;color:var(--ink-2);text-decoration:none;background:none;border:0}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,260px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px;margin:-4px -2px -10px}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}
@media (max-width:600px){.row{grid-auto-columns:68%}}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qt{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 14px 0 0;border-radius:var(--r-s);background:var(--raised);box-shadow:var(--shadow-1);text-decoration:none;font-weight:700;overflow:hidden;border:0;text-align:left;transition:transform .12s var(--ease)}
.qt:active{transform:scale(.98)}
.qt .ic{width:64px;align-self:stretch;display:grid;place-items:center;background:var(--sand);color:var(--green);flex:none;background-size:cover;background-position:center}
.qt .ic svg{width:26px;height:26px}
.qt span:last-child{min-width:0;line-height:1.2}

/* Cards with photo */
.card{display:grid;gap:10px;text-decoration:none;background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.card .ph{aspect-ratio:4/3;max-width:100%;border-radius:var(--r);background:var(--sand) center/cover no-repeat;box-shadow:var(--shadow-1);position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.card:hover .ph{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.card .ph .tag{position:absolute;top:10px;left:10px}
.card .ph .fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--green-2);opacity:.55}
.card .ph .fallback .logo{width:58%}
.card b{font-family:var(--f-display);font-size:1.25rem;font-weight:500;line-height:1.15}
.card small{display:block;color:var(--ink-2);font-size:.86rem;line-height:1.35;margin-top:2px}
.card .pr{font-weight:700;color:var(--green-2);font-size:.86rem;margin-top:4px}
.card.wide .ph{aspect-ratio:4/3}
.grid-cards{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
@media (max-width:600px){.grid-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.card b{font-size:1.1rem}}

/* Lists */
.list{display:grid;background:var(--raised);border-radius:var(--r);box-shadow:var(--shadow-1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;background:none;text-align:left;width:100%;text-decoration:none;color:inherit;min-height:68px}
.li+.li{border-top:1px solid var(--line)}
.li:hover{background:color-mix(in srgb,var(--sand) 45%,transparent)}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{display:block;font-size:.86rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--ink-3);flex:none}
.li .thumb{width:48px;height:48px;border-radius:10px;background:var(--sand) center/cover;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem;color:var(--green)}
.li .thumb.round{border-radius:50%}
.li.urgent{box-shadow:inset 3px 0 0 var(--crit)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:44px 20px;border-radius:var(--r);background:var(--surface);color:var(--ink-2)}
.empty b{font-family:var(--f-display);font-size:1.4rem;font-weight:500;color:var(--ink)}
.empty svg{width:40px;height:40px;color:var(--ink-3)}

.page-head{display:grid;gap:6px}
.page-head h1{font-size:clamp(2.1rem,4.4vw,3rem)}
.page-head p{color:var(--ink-2);font-size:1.05rem;max-width:62ch}
.cmp{overflow-x:auto;border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-1)}
.cmp table{border-collapse:collapse;width:100%;min-width:700px;font-size:.9rem}
.cmp th,.cmp td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.cmp tr:last-child td{border-bottom:0}
.cmp td:first-child{font-family:var(--f-display);font-size:1.1rem}
.cmp tbody tr{cursor:pointer}
.cmp tbody tr:hover td{background:color-mix(in srgb,var(--sand) 40%,transparent)}
.price{color:var(--green-2);font-weight:700}

/* Progress ring */
.llists{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-1);border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-2,0 8px 24px rgba(0,0,0,.08))}
.lcard .lc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lcard .lc-name{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;color:var(--green)}
.lcard .lc-sub{color:var(--muted,#6b6b6b);font-size:.92rem}
.lcard .lc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line,#e6dfcf);font-weight:700;font-size:.9rem;color:var(--green)}
.lcard .thumb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e6dcc4;color:var(--green)}
.lback{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;font-weight:700;color:var(--green);cursor:pointer}
.lback svg{transform:rotate(180deg)}
.prog{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-1)}
.prog svg{flex:none}
.prog b{font-family:var(--f-display);font-size:1.25rem;font-weight:500}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;background:var(--surface);box-shadow:var(--shadow-2);display:flex;flex-direction:column;transition:transform .32s var(--ease)}
@media (min-width:901px){.sheet{top:0;right:0;bottom:0;width:min(520px,100vw);transform:translateX(105%);border-radius:var(--r-l) 0 0 var(--r-l)}.sheet.on{transform:none}}
@media (max-width:900px){.sheet{left:0;right:0;bottom:0;max-height:92vh;transform:translateY(105%);border-radius:var(--r-l) var(--r-l) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}.sheet.on{transform:none}.sheet .grab{display:block}}
.sheet .grab{display:none;width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.sheet-close{position:absolute;top:12px;right:12px;z-index:2;background:color-mix(in srgb,var(--raised) 85%,transparent);backdrop-filter:blur(8px)}
.gal{position:relative;background:var(--sand)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/3;max-width:100%}
.gal-track::-webkit-scrollbar{display:none}
.gal-track figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;background:#ebe4d4}
.gal-track img{width:100%;height:100%;object-fit:contain;display:block}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(253,252,251,.92);color:#1e3932;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}
.gal:hover .gal-nav{opacity:1}
.gal-nav[data-gal="prev"]{left:12px}.gal-nav[data-gal="next"]{right:12px}
.gal-nav svg{width:20px;height:20px}
.gal-count{position:absolute;left:14px;bottom:12px;background:rgba(30,57,50,.78);color:#fdfcfb;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}

.sh-hero{aspect-ratio:16/10;background:var(--sand) center/cover no-repeat;position:relative}

.sh-body{padding:22px 24px 28px;display:grid;gap:18px}

.sh-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface);padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.specs{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:8px 18px;margin:0;font-size:.95rem}

.note{background:var(--raised);border-radius:var(--r-s);padding:14px 16px;font-size:.94rem;box-shadow:inset 3px 0 0 var(--gold)}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:.92rem;color:var(--ink-2)}

.copyline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r-s);background:var(--raised);font-weight:700}

.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:10px;font-size:.9rem}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}

/* ---------- Inputs ---------- */
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.input{width:100%;min-height:52px;border-radius:12px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line);padding:0 16px;font-size:1.02rem;transition:box-shadow .15s}

.input::placeholder{color:var(--ink-3)}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

/* ---------- Search overlay ---------- */
.search-ov{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .18s}
.search-ov.on{opacity:1;pointer-events:auto}
.search-top{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);max-width:860px;width:100%;margin:0 auto}

mark{background:color-mix(in srgb,var(--gold) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Wizard ---------- */
.wiz{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s var(--ease)}
.wiz.on{transform:none}
.wiz-top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}

.wiz-top .title small{display:block;font-weight:400;color:var(--ink-3);font-size:.8rem}
.bar{height:4px;background:var(--sand);border-radius:2px;overflow:hidden;margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar i{display:block;height:100%;background:var(--green-2);border-radius:2px;transition:width .35s var(--ease)}
.wiz-scroll{flex:1;overflow-y:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wiz-step{max-width:720px;margin:0 auto;display:grid;gap:22px}
.wiz-step h2{font-size:clamp(1.9rem,4vw,2.5rem)}
.wiz-step .lead{color:var(--ink-2);font-size:1.05rem;margin-top:-12px}
.wiz-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.wiz-foot .in{max-width:720px;width:100%;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
@media (max-width:600px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pk{position:relative;display:grid;gap:6px;background:none;border:0;padding:0;text-align:left}
.pk .ph{aspect-ratio:4/3;border-radius:12px;background:var(--sand) center/cover;box-shadow:var(--shadow-1);transition:box-shadow .15s,transform .12s;position:relative;overflow:hidden}
.pk .ph .fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--green-2);opacity:.5}
.pk .ph .fallback .logo{width:60%}
.pk b{font-size:.95rem;line-height:1.2}
.pk .check{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(253,252,251,.92);display:grid;place-items:center;color:transparent;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pk[aria-pressed="true"] .ph{box-shadow:0 0 0 3px var(--green-2)}
.pk[aria-pressed="true"] .check{background:var(--green-2);color:#fff}
.pk:active .ph{transform:scale(.97)}
.picked{display:grid;gap:10px}
.pitem{background:var(--raised);border-radius:var(--r);box-shadow:var(--shadow-1);padding:14px;display:grid;gap:12px}
.pitem-top{display:flex;align-items:center;gap:12px}
.pitem-top .thumb{width:52px;height:52px;border-radius:10px;background:var(--sand) center/cover;flex:none}
.pitem-top .grow{flex:1;min-width:0;font-weight:700}
.pitem-top .grow small{display:block;font-weight:400;color:var(--ink-3)}
.pitem details summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--green-2);list-style:none}
.pitem details summary::-webkit-details-marker{display:none}
.pitem details[open] summary{margin-bottom:12px}
.review{display:grid;gap:14px}
.rv{background:var(--raised);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-1);display:grid;gap:8px}
.rv-h{display:flex;justify-content:space-between;align-items:center}

.drop{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--surface);cursor:pointer}

/* Resume draft pill */
.resume{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:24px;display:flex;align-items:center;gap:12px;background:var(--green);color:var(--beige);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow-2);border:0;max-width:calc(100vw - 32px)}

@media (min-width:901px){.resume{left:calc(50% + 126px)}}

.toast{position:fixed;z-index:120;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow-2);transition:transform .3s var(--ease);display:flex;gap:8px;align-items:center}
.toast{visibility:hidden}.toast.on{transform:translate(-50%,0);visibility:visible}

/* FAQ */
details.q{background:var(--raised);border-radius:var(--r-s);box-shadow:var(--shadow-1)}
details.q+details.q{margin-top:8px}
details.q summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;gap:12px;justify-content:space-between;align-items:center}

details.q summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s;flex:none;margin-top:-4px}

details.q .a{padding:0 18px 18px;color:var(--ink);max-width:70ch;display:grid;gap:8px}
details.q .a ul,details.q .a ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
details.q .src{font-size:.78rem;color:var(--ink-3)}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.ktile{border:0;border-radius:var(--r);padding:18px;min-height:120px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;color:var(--beige);background:var(--green);box-shadow:var(--shadow-1);transition:transform .15s var(--ease)}
.ktile:hover{transform:translateY(-2px)}
.ktile b{font-family:var(--f-display);font-size:1.35rem;font-weight:500;color:#fdfcfb}
.ktile small{color:rgba(237,216,188,.8)}
.ktile.t2{background:#3b7248}.ktile.t3{background:#6b5a35}.ktile.t4{background:#2d4f5c}.ktile.t5{background:#5a3b33}.ktile.t6{background:#45503a}
.pitch blockquote{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.35}
.people{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.person{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-1)}
.person .grow{min-width:0}
.person b{display:block}
.person small{display:block;color:var(--ink-3);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.person span{display:block;font-size:.9rem;user-select:all;overflow-wrap:anywhere}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}

.obj{display:grid;gap:10px}

/* ---------- Rum (affärsmöjlighet) ---------- */
.room{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.room-top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--side);color:var(--side-ink)}
.room-top .icon-btn{color:var(--side-ink)}
.room-top h1{font-size:1.45rem;color:#fdfcfb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-top .sub{font-size:.8rem;color:var(--side-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-top .grow{flex:1;min-width:0}
.room-tabs{display:none}
.room-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px)}
.room-left{overflow-y:auto;padding:28px max(20px,env(safe-area-inset-left,0px)) 60px;min-width:0}
.room-left>div{max-width:760px;margin:0 auto;display:grid;gap:22px}

  .room-body{grid-template-columns:1fr}
  .room-tabs{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}

  .room[data-tab="info"] .room-right{display:none}

  .room-left{padding:20px 16px 40px}
}
.statusbox{background:var(--raised);border-radius:var(--r);box-shadow:var(--shadow-1);padding:16px 18px;display:grid;gap:12px}
.statusbox .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.flowline{display:flex;gap:4px}

.sec{display:grid;gap:10px}
.sec>h3{font-family:var(--f-body);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.card-plain{background:var(--raised);border-radius:var(--r);box-shadow:var(--shadow-1);padding:16px 18px}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}

.msgs{flex:1;overflow-y:auto;padding:12px 0 8px;overscroll-behavior:contain}
.day{display:flex;align-items:center;gap:10px;margin:14px 18px 6px;font-size:.8rem;font-weight:700;color:var(--ink-3)}

.msg{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:4px 18px 4px 16px}

.mtools{position:absolute;right:14px;top:-14px;display:none;background:var(--raised);border-radius:8px;box-shadow:var(--shadow-2);padding:3px;gap:2px;z-index:2}

.sysmsg{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-3);padding:6px 18px;text-align:center}

.composer{border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}

/* ---------- Ritning ---------- */
.drw{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:22px;align-items:start}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickrow{display:flex;gap:6px}
.quickrow button{flex:1;height:36px;border-radius:8px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:.85rem;color:var(--ink-2)}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--raised);border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);padding:6px 6px 6px 14px}

/* v127: introkort i Mått (startsidan borttagen för kunden, Carl 12/11) */
#wiz .pintro{position:relative;border-radius:16px;padding:14px 16px 13px;background:radial-gradient(120% 90% at 100% 0,rgba(201,169,106,.16),transparent 60%),linear-gradient(160deg,#284a31,#1b3022);color:#efe7d6;display:grid;gap:9px;margin-bottom:4px}
#wiz .pintro-ov{font:700 10px/1.2 var(--f-body,Lato,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#c9a86a;padding-right:28px}
#wiz .pintro-t{font:500 1.35rem/1.1 var(--f-display,"EB Garamond",serif);color:#fff;margin-top:-3px}
#wiz .pintro-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#wiz .pintro-steps div{display:grid;gap:3px;align-content:start;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.06)}
#wiz .pintro-steps div.on{background:rgba(201,169,106,.22);box-shadow:inset 0 0 0 1px rgba(201,169,106,.6)}
#wiz .pintro-steps b{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#fff;line-height:1.15}
#wiz .pintro-steps i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#c9a86a;color:#22301f;display:grid;place-items:center;font-weight:900;font-size:.62rem;flex:none}
#wiz .pintro-steps small{font-size:.7rem;line-height:1.3;color:rgba(239,231,214,.82)}
#wiz .pintro-tr{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:.74rem;color:rgba(239,231,214,.9)}
#wiz .pintro-tr span::before{content:"✓ ";color:#c9a86a;font-weight:900}
#wiz .pintro-x{position:absolute;top:9px;right:10px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#efe7d6;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
#wiz .pintro-x:hover{background:rgba(255,255,255,.22)}
/* v128: boxar på båda långsidor och gavlarna i samma steg */
#wiz .absame{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px;margin:2px 0 10px;cursor:pointer;font:inherit;color:var(--ink)}
#wiz .absame b{display:block;font-size:.9rem}
#wiz .absame small{display:block;font-size:.76rem;color:var(--ink-3);margin-top:1px}
#wiz .absw{width:38px;height:22px;border-radius:999px;background:#cfc6b2;position:relative;flex:none;transition:background .2s}
#wiz .absw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
#wiz .absame[aria-pressed="true"] .absw{background:var(--green)}
#wiz .absame[aria-pressed="true"] .absw::after{left:19px}
#wiz .abside{border:1.5px solid var(--line);border-radius:14px;background:#faf8f3;margin-bottom:8px}
#wiz .abside.on{border-color:var(--green);background:#fff}
#wiz .abh{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;font:inherit;color:var(--ink);text-align:left}
#wiz button.abh{cursor:pointer}
#wiz button.abh:hover{background:rgba(35,65,42,.04);border-radius:13px}
#wiz .abh b{flex:1;font-size:.95rem}
#wiz .abb{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.72rem;flex:none}
#wiz .abb.g{background:#8a6a2c}
#wiz .abs{font-size:.78rem;color:var(--ink-3);text-align:right;line-height:1.3}
#wiz button.abh .abs::after{content:" ›";color:var(--green);font-weight:700}
#wiz .abx{width:26px;height:26px;border-radius:50%;border:0;background:#f1ede3;color:var(--ink-2);font-size:16px;line-height:1;cursor:pointer}
#wiz .abbody{padding:0 12px 12px}
#wiz .abbody{display:grid;gap:10px}
#wiz .abbody>*{margin:0!important}
#wiz .abside.on{position:relative}
#wiz .abbody .bigstep{position:absolute;top:6px;right:10px;padding:0!important;gap:0}
#wiz .abbody .bigstep::before{display:none!important}
#wiz .abbody .bigstep button{width:34px!important;height:34px!important;font-size:1.1rem!important}
#wiz .abbody .bigstep>div{height:34px!important;min-width:58px!important;padding-top:3px!important}
#wiz .abbody .bigstep .num{font-size:1.3rem!important}

#wiz .abbody .bwin input{height:36px!important}
#wiz .abbody .bwpick{padding:0!important;box-shadow:none!important;background:none!important;border-radius:0!important;gap:6px!important;max-width:none}
#wiz .abbody .bwpick .hint3{display:none}
#wiz .abbody .resline{padding:7px 10px!important;font-size:.8rem!important;line-height:1.35}
#wiz .abside.on .abh{padding-bottom:6px}
#wiz .cfg-q:has(.absame) .lead{margin-bottom:8px}
#wiz .abg{grid-template-columns:1fr 1fr;margin-top:0}
#wiz .abg .gstep{border:1.5px solid var(--line);border-radius:10px;padding:5px 6px 5px 10px;gap:6px}
#wiz .abg .gstep button{width:30px;height:30px;font-size:1rem}
#wiz .abadd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px dashed #c9c0ab;border-radius:14px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit;color:var(--green)}
#wiz .abadd:hover{border-color:var(--green)}

/* v128: introkortet större och tydligare (när skärmen är hög nog) */
@media (min-height:800px){
#wiz .pintro{padding:20px 20px 18px;gap:14px;border-radius:18px;margin-bottom:8px}
#wiz .pintro-ov{font-size:11px}
#wiz .pintro-t{font-size:1.9rem;margin-top:-2px}
#wiz .pintro-steps{gap:8px}
#wiz .pintro-steps div{padding:12px 12px 13px;gap:6px;border-radius:12px}
#wiz .pintro-steps b{font-size:.98rem;gap:8px}
#wiz .pintro-steps i{width:24px;height:24px;font-size:.78rem}
#wiz .pintro-steps small{font-size:.82rem;line-height:1.35}
#wiz .pintro-tr{font-size:.86rem;gap:4px 18px}
#wiz .pintro-x{top:12px;right:12px;width:28px;height:28px;font-size:17px}
}
/* v129: introkortets siffror och rubriker på exakt samma nivå (Carl 12/11) */
#wiz .pintro-steps div{grid-template-rows:auto 1fr}
#wiz .pintro-steps b{align-items:flex-start;line-height:16px;min-height:32px}
#wiz .pintro-steps i{height:18px;margin-top:-1px}
#wiz .pintro-steps small{margin-top:-2px}
@media (max-height:799px){#wiz .pintro{gap:6px;padding-top:11px;padding-bottom:10px}}
@media (min-height:800px){#wiz .pintro-steps b{line-height:20px;min-height:40px}#wiz .pintro-steps i{height:24px;margin-top:-2px}#wiz .pintro-steps small{margin-top:0}}
/* v130: hörnbox */
#wiz .abcorner{display:grid;gap:6px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
#wiz .abcorner .bwl{font-size:.68rem}
#wiz .abct{display:flex;align-items:center;gap:9px;border:0;background:none;padding:2px 0;font:inherit;font-size:.86rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
#wiz .abcb{width:18px;height:18px;border-radius:5px;border:1.5px solid #c9c0ab;flex:none;display:grid;place-items:center;background:#fff}
#wiz .abct[aria-pressed="true"] .abcb{background:var(--green);border-color:var(--green)}
#wiz .abct[aria-pressed="true"] .abcb::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pcorner rect+rect{transition:transform .15s}
.pcorner:hover rect+rect{fill:#2f5d3a}
/* v132 */
.wpulse{transform-box:fill-box;transform-origin:center;animation:wpulse 1s ease-out 3;opacity:0;pointer-events:none}
.wpulse.wp2{animation-name:wpulse2}
@keyframes wpulse{0%{opacity:1;transform:scale(.25)}100%{opacity:0;transform:scale(1.25)}}
@keyframes wpulse2{0%{opacity:1;transform:scale(.2)}60%{opacity:.6}100%{opacity:0;transform:scale(.9)}}
.vcname{font-size:.78rem;font-weight:700;color:var(--ink);margin-left:4px;white-space:nowrap}
.vcname small{font-weight:400;color:var(--ink-3);font-size:.72rem}
.sm-done{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(160deg,#f3f6ef,#eaf0e5);box-shadow:inset 0 0 0 1.5px #cdd9c6}
.sm-dico{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.sm-dtx{flex:1;min-width:180px;display:grid;gap:2px}
.sm-dtx b{font-family:var(--f-display,"EB Garamond",serif);font-weight:500;font-size:1.3rem;color:var(--green);line-height:1.1}
.sm-dtx span{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.sm-dact{display:flex;gap:8px;flex-wrap:wrap}
.sm-dact .btn{white-space:nowrap}
/* v133 */
.ovf{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 14px;box-shadow:inset 0 0 0 1.5px #e7b9b3,0 6px 18px rgba(178,58,48,.08)}
.ovf-i{width:30px;height:30px;border-radius:50%;background:#fbecea;color:#b23a30;display:grid;place-items:center;font-weight:900;flex:none}
.ovf-t{flex:1;display:grid;gap:3px}
.ovf-t b{font-size:.95rem;color:var(--ink)}
.ovf-t>span{font-size:.84rem;color:var(--ink-2)}
.ovf-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fgal{grid-auto-flow:dense}
html body #wiz .fgal .dpop{grid-column:1/-1;position:relative;background:linear-gradient(160deg,#284a31,#1b3022)!important;color:#efe7d6;box-shadow:none!important;border:0!important;gap:8px;padding:14px 16px;margin-top:2px;animation:dpopIn .25s ease-out}
html body #wiz .fgal .dpop::before{content:"";position:absolute;top:-7px;left:calc(25% - 7px);width:14px;height:14px;background:#284a31;transform:rotate(45deg)}
html body #wiz .fgal .dpop.dr::before{left:calc(75% - 7px)}
html body #wiz .fgal .dpop .mbox-h{color:#fff!important;margin:0;font-size:1rem}
html body #wiz .fgal .dpop .fx-help{color:rgba(239,231,214,.88)!important;margin:0}
html body #wiz .fgal .dpop .fx-help b{color:#fff}
html body #wiz .fgal .dpop .seg .opt{background:rgba(255,255,255,.08)!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)!important;border-color:transparent!important}
html body #wiz .fgal .dpop .seg .opt:hover{background:#c9a86a!important;color:#22301f!important}
html body #wiz .fgal .dpop .fx-sum{color:rgba(239,231,214,.8);border-color:rgba(255,255,255,.15);margin:0}
html body #wiz .fgal .dpop .fx-sum span{color:#e3c78f}
@keyframes dpopIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* v134: dra måtten i ritningen */
.rs-h .rs-pill{fill:#23412a;opacity:.32;transition:opacity .15s}
.rs-h .rs-grip{stroke:#fff;stroke-width:14;stroke-linecap:round;opacity:.0;transition:opacity .15s;fill:none}
.rs-h:hover .rs-pill{opacity:1}
.dragging .rs-h .rs-pill{opacity:.18}
.dragging .rs-h:hover .rs-pill{opacity:1}
.rs-h:hover .rs-grip{opacity:1}
.rs-front .rs-pill{opacity:.22}
#wiz .rs-k{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:.62rem;font-weight:900;vertical-align:1px;margin:0 2px}
#wiz .rs-tip span{line-height:1.55}
#wiz .movetip .rs-k{background:#c9a86a;color:#22301f;width:20px;height:20px;font-size:.7rem}
@keyframes rsFlash{0%{box-shadow:0 0 0 3px #c9a86a}100%{box-shadow:0 0 0 0 rgba(201,168,106,0)}}
#wiz .rs-flash{animation:rsFlash 1.2s ease-out}
/* v135: tydligare instruktion för att dra i ritningen */
#wiz .rsg{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:#f6f3ea;box-shadow:inset 0 0 0 1.5px #e3dac6;margin-bottom:10px}
#wiz .rsg-h{font-size:.92rem;color:var(--green)}
#wiz .rsg-r{display:flex;align-items:center;gap:12px}
#wiz .rsg-r svg{width:58px;height:36px;flex:none;background:#efe8da;border-radius:8px;padding:2px}
#wiz .rsg-r span{font-size:.8rem;color:var(--ink-2);line-height:1.35}
#wiz .rsg-r span b{display:block;font-size:.86rem;color:var(--ink)}
#wiz .rsg-f{margin:0;font-size:.76rem;color:var(--ink-3)}
</style>

.wpulse.wpw{animation-delay:1.1s}
#wiz .mf.rs-live{box-shadow:0 0 0 3px #c9a86a!important;border-radius:14px;transition:box-shadow .15s}
#wiz .mf.rs-live input{color:var(--green)}
#wiz .rsg1{margin:0 0 8px;padding:7px 12px}
@media (min-height:800px){#wiz .pintro{padding:16px 18px 13px;gap:9px}#wiz .pintro-steps div{padding:10px 11px 11px}}
#wiz .rsg1+.dimin{margin-top:0}
@media (max-height:799px){#wiz .rsg1 .rsg-r svg{display:none}#wiz .rsg1{padding:6px 10px;margin-bottom:6px}}
#wiz .rsg1 .rsg-r svg{width:48px;height:30px}
#wiz .pintro~p.lead{display:none}
.rs-outer .rs-pill{opacity:1}
.rs-outer .rs-grip{opacity:1}
/* v141: verktygsradens dropdowns + färgkodade handtag */
.vm{position:relative;display:inline-flex}
.vm-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 14px;border-radius:999px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px #e2dccf,0 1px 2px rgba(31,42,33,.05);font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;transition:box-shadow .15s}
.vm-btn:hover,.vm-btn[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--green),0 4px 14px rgba(31,42,33,.1)}
.vm-btn small{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.vm-btn b{font-size:.86rem;font-weight:700}
.vm-car{width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);margin-left:2px;transition:transform .15s}
.vm-btn[aria-expanded="true"] .vm-car{transform:rotate(225deg) translate(-1px,-1px)}
.vm-sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.vm-sw.lg{width:26px;height:26px}
.vm-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:240px;max-height:min(420px,60vh);overflow:auto;background:#fff;border-radius:16px;padding:6px;box-shadow:0 18px 50px rgba(18,36,26,.22),0 0 0 1px rgba(18,36,26,.06);animation:vmIn .14s ease-out}
.vm-pop .vm-h{margin:6px 10px 6px;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
@keyframes vmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.vm-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.vm-it:hover{background:#f3f5ef}
.vm-it[aria-selected="true"]{background:#eef2ea}
.vm-ck{width:16px;color:var(--green);font-weight:900;flex:none;text-align:center}
.vm-tx{display:grid;flex:1}
.vm-tx b{font-size:.9rem}
.vm-tx small{font-size:.74rem;color:var(--ink-3)}
.vm-dots{display:inline-flex;gap:3px}.vm-dots i{width:9px;height:9px;border-radius:50%}
.vm-lgd{min-width:280px;padding:10px 12px;display:grid;gap:8px}
.vm-l{display:flex;gap:12px;align-items:center}
.vm-l .hd{width:8px;height:26px;border-radius:5px;flex:none;margin:0 9px}
.vm-l .hd.hz{width:26px;height:8px;margin:0}
.vm-l .hd.mv{width:26px;height:26px;border-radius:50%;background:#f1e6c9;color:var(--green);display:grid;place-items:center;font-style:normal;font-size:.9rem;margin:0}
.vm-l span{display:grid;font-size:.78rem;color:var(--ink-2)}
.vm-l b{font-size:.86rem;color:var(--ink)}

function gallery(id){
  const list=(GAL[id]&&GAL[id].length?GAL[id]:[img(id)]).filter(Boolean);
  if(!list.length)return `<div class="sh-hero">${fallback("")}</div>`;
  if(list.length===1)return `<div class="sh-hero" ${ph(list[0])}></div>`;
  return `<div class="gal" data-galn="${list.length}"><div class="gal-track" id="galtrack">${list.map((u,i)=>`<figure><img src="${esc(u)}" alt="Bild ${i+1} av ${list.length}" ${i>1?'loading="lazy"':''}></figure>`).join("")}</div>
    <button class="gal-nav" data-gal="prev" aria-label="Föregående bild">${svg("back")}</button><button class="gal-nav" data-gal="next" aria-label="Nästa bild">${svg("chev")}</button>
    <span class="gal-count num" id="galcount">1 / ${list.length}</span><div class="gal-dots">${list.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div></div>
    <div class="gal-thumbs">${list.map((u,i)=>`<button data-gto="${i}" class="${i?"":"on"}" style="background-image:url('${esc(u)}')" aria-label="Visa bild ${i+1}"></button>`).join("")}</div>`;

function noteCtx(){const w=$("#wiz"),inWiz=w&&!w.hidden&&w.classList.contains("on");if(inWiz){const PG=wizPages(),pg=PG[S.wizStep||0],sp=D.spec||{};const t=(pg?.list||[]).map(x=>(x.html?(x.html().match(/<h2>([^<]+)<\/h2>/)||[])[1]:"")).filter(Boolean)[0]||pg?.key||"";return {where:`Konfiguratorn · ${pg?.list?.[0]?.sec||""} · ${t}`.replace(/\s·\s$/,""),step:pg?.key||"",front:sp.front||"",boxes:D.drawing?layout(D.drawing).filter(o=>o.m.t==="box").length:0}}
  const r=$("#room");if(r&&!r.hidden&&typeof R!=="undefined"&&R.id){const q=S.quotes.find(x=>x.id===R.id);return {where:`Affärsmöjlighet · ${q?(q.customer?.company||q.customer?.name||""):""}`}}
  const v={hem:"Hem",sortiment:"Sortiment",offerter:"Affärsmöjligheter",leads:"Leads",kunskap:"Kunskap",formular:"Formulärets frågor"}[view()]||view();return {where:v}}
function noteCount(){const n=(S.notes||[]).filter(x=>!x.done).length,el=$("#notecount");if(el){el.hidden=!n;el.textContent=n}}
function openNotes(refresh){const ctx=noteCtx(),me=ROLES[S.role]?.name||"";const tp=ls.get("myrby.testplan",{});const L=S.notes||[];const open=L.filter(x=>!x.done),done=L.filter(x=>x.done);
  const item=x=>`<div class="nt-it ${x.done?"done":""}"><button class="nt-ck" data-notedone="${esc(x.id)}" aria-pressed="${!!x.done}" title="${x.done?"Öppna igen":"Markera klar"}">${svg("check",14)}</button><div><p class="nt-meta"><span class="nt-ty t-${esc(x.type||"")}">${esc(x.type||"Notering")}</span>${esc(x.name||"")} · ${new Date(x.createdAt||0).toLocaleString("sv-SE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p><p class="nt-tx">${esc(x.text||"")}</p><p class="nt-where">${esc(x.ctx?.where||"")}</p>${x.reply?`<p class="nt-reply">${svg("check",13)} ${esc(x.reply)}</p>`:""}</div></div>`;
  const html=`<div class="sh-body" id="notesheet" style="padding-top:30px"><div><p class="eyebrow">Testa portalen</p><h2>Anteckningar</h2><p class="muted">Skriv det du ser, fel, förslag eller frågor. Vi sparar automatiskt var i portalen du är.</p></div>

   <div class="nt-list"><p class="eyebrow">Att åtgärda · ${open.length}</p>${open.length?open.map(item).join(""):`<p class="faint">Inga öppna anteckningar.</p>`}${done.length?`<details><summary class="faint">Klara · ${done.length}</summary>${done.map(item).join("")}</details>`:""}</div></div>`;
  if(refresh&&$("#notesheet")){const t=$("#notetext");S.ndraft=t?t.value:S.ndraft;$("#sheet .sheet-scroll").innerHTML=html;return}openSheet(html,"")}
async function saveNote(){const t=$("#notetext"),txt=(t?.value||"").trim();if(!txt){toast("Skriv något först");t?.focus();return}const name=($("#notename")?.value||"").trim();ls.set("myrby.notename",name);if(!S.db){toast("Ingen anslutning");return}
  const ctx=noteCtx();try{await S.db.collection("notes").add({text:txt,type:S.ntype||"Förslag",name,ctx,createdAt:Date.now(),done:false,by:S.uid||"",draft:D.ui?.kind?JSON.stringify({spec:D.spec,ui:{kind:D.ui.kind},fmix:D.drawing?.fmix||null}).slice(0,4000):""});S.ndraft="";if(t)t.value="";S.nperm=false;toast("Anteckning sparad, tack!");openNotes(true)}catch(e){if(e&&e.code==="invalid_argument"){S.nperm=true;S.ndraft=txt;openNotes(true);toast("Du har bara läsbehörighet, se rutan")}else toast("Kunde inte spara, försök igen")}}

function inkIn(cv,prev){const svg=cv.querySelector("svg.pretty");if(!svg||!prev.size)return false;let n=0;svg.querySelectorAll(INK_SEL).forEach(e=>{if(e.closest("defs")||e.classList.contains("wpulse")||e.classList.contains("npr")||prev.has(e.outerHTML)||n>700)return;n++;const tg=e.tagName;
  if((tg==="line"||tg==="path"||tg==="polyline")&&!e.getAttribute("stroke-dasharray")){e.setAttribute("pathLength","1000");e.classList.add("ink")}else e.classList.add("inkf")});return n>0}

function drwApply(dr,key,val){
  if(key==="rows"){dr.rows=+val;dr.n=[null,null]}

function bindDrawing(get,onChange){

    if(d.d3sizein){const v=Math.round(+t.value),r=sizeRule(dr.front);const cl=Math.max(r.min,Math.min(r.max,v));if(cl!==v)toast(`${prod(dr.front)?.name} görs ${mm(r.min)}–${mm(r.max)} mm`);applySize(dr,d.d3sizein,cl);commit(true);return}

    if(d.d2fan){dr.fans=Math.max(0,Math.min(8,(dr.fans||0)+ +d.d2fan));commit(true);return}
  };

function applySize(dr,target,v){

function ovHTML(html,o){
  if(o.title)html=html.replace(/<h2>[\s\S]*?<\/h2>/,`<h2>${esc(o.title)}</h2>`);
  if(typeof o.lead==="string"){const lp=/<p class="lead">[\s\S]*?<\/p>/;if(lp.test(html))html=html.replace(lp,o.lead?`<p class="lead">${esc(o.lead)}</p>`:"");else if(o.lead)html=html.replace(/<\/h2>/,`</h2><p class="lead">${esc(o.lead)}</p>`)}
  return html}
const xVal=c=>(D.extra||{})[c.id];
const xAnswered=c=>{const v=xVal(c);return Array.isArray(v)?v.length>0:v!=null&&String(v).trim()!==""};
const xFmt=v=>Array.isArray(v)?v.join(", "):String(v??"");
function xOpts(c){return c.type==="yesno"?["Ja","Nej"]:(c.options||[])}
function customHTML(c){const v=xVal(c),id=c.id;

  else if(c.type==="number")b=`<div class="field"><div class="mf" style="max-width:280px"><label>Värde</label><input type="text" inputmode="numeric" data-xans="${id}" value="${esc(v||"")}"><em>${esc(c.unit||"")}</em></div></div>`;
  else if(c.type==="choice"||c.type==="yesno")b=`<div class="qcards">${xOpts(c).map(o=>`<button type="button" class="qc" data-xpick="${id}" data-v="${esc(o)}" aria-pressed="${v===o}"><b>${esc(o)}</b></button>`).join("")}</div>`;
  else if(c.type==="multi")b=`<div class="qcards">${xOpts(c).map(o=>`<button type="button" class="qc tog" data-xmulti="${id}" data-v="${esc(o)}" aria-pressed="${Array.isArray(v)&&v.includes(o)}"><span class="tick">${svg("check",14)}</span><b>${esc(o)}</b></button>`).join("")}</div>`;
  else b=`<label class="field"><input class="input" data-xans="${id}" value="${esc(v||"")}"></label>`;
  return `<h2>${esc(c.title)}${c.req?"":` <span class="optag">valfri</span>`}</h2>${c.help?`<p class="lead">${esc(c.help)}</p>`:""}${b}`}
function customScreen(c){return {id:"c-"+c.id,sec:c.sec,custom:true,ok:c.req?()=>xAnswered(c):undefined,need:"Svara på: "+c.title,html:()=>customHTML(c)}}
function insertCustom(list,mk){
  for(const c0 of (FM().custom||[])){const c={...c0,sec:secOf(c0)};if(!FSECS.includes(c.sec))continue;const sc=mk(c);let i=list.findIndex(x=>x.id===c.after);
    if(i<0||list[i].sec!==c.sec){i=-1;list.forEach((x,j)=>{if(x.sec===c.sec)i=j});if(i<0){const si=FSECS.indexOf(c.sec);list.forEach((x,j)=>{if(FSECS.indexOf(x.sec)<si)i=j})}}
    list.splice(i+1,0,sc)}
  return list}
function applyForm(L){if(S.noOv)return L;const ov=FM().ov||{};

let BASECAT=null;
function baseCatalog(){if(BASECAT)return BASECAT;const save=D,saveStep=S.wizStep;

/* v163: ingångar och boxrader – en regel för alla väggar.
   1) En dörr flyttas ALDRIG av att boxar läggs till, tas bort eller ändras. Bara kunden flyttar den.
   2) Framför en dörr är det alltid fritt (en passage lika bred som dörren, genom hela boxraden).
   3) Fyll jämnt: boxarna delar upp väggen mellan dörrarna i jämna delar. Samma/olika bredd: boxarna läggs i ordning och hoppar över dörren.
   4) Får boxarna inte plats tas en box bort (meddelande säger det). Ligger helt sist i skriptet så att inga andra autoFill-omslag kan flytta något efteråt. */
function doorSpans(dr,k,base,len){const sp=(dr.doors||[]).filter(d=>d.k===k).map(d=>{const s0=(+d.p||0)-base;return {s:Math.max(0,s0),e:Math.min(len,s0+(+d.w||0))}}).filter(x=>x.e-x.s>1).sort((a,b)=>a.s-b.s);
  const m=[];sp.forEach(x=>{const l=m[m.length-1];if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e);else m.push({...x})});return m}
function doorPlace(dr,k,ms,sp,len,c,how){const hard=m=>m.t==="box"||m.t==="room",r=sizeRule(dr.front),gap=(w,o)=>({id:uid2(),t:"gap",w:Math.round(w),...o});
  if(how==="lika"){if(!((c.mode||"lika")==="lika"&&r.type!=="fixed"&&ms.length&&ms.every(m=>m.t==="box"||m.autoRest)))return false;const bx=ms.filter(m=>m.t==="box"),n=bx.length,mn=r.min||2500,mx=Math.min(r.max||6000,6000);if(!n)return false;
    const segs=[];let x=0;sp.forEach(q=>{segs.push({a:x,b:q.s,q});x=q.e});segs.push({a:x,b:len,q:null});const L=segs.map(g=>Math.max(0,g.b-g.a)),T=L.reduce((a,b)=>a+b,0)||1;
    const per=(i,c2)=>c2?L[i]/c2:0,okc=(i,c2)=>c2===0||(per(i,c2)>=mn-1&&per(i,c2)<=mx+1);
    const cnt=L.map(l=>{let v=Math.round(n*l/T);while(v>0&&l/v<mn)v--;if(v>0)while(l/v>mx)v++;return v});
    let guard=0;while(cnt.reduce((a,b)=>a+b,0)<n&&guard++<50){let bi=-1,bw=0;cnt.forEach((v,i)=>{if(okc(i,v+1)&&L[i]/(v+1)>bw){bw=L[i]/(v+1);bi=i}});if(bi<0)break;cnt[bi]++}
    guard=0;while(cnt.reduce((a,b)=>a+b,0)>n&&guard++<50){let bi=-1,bw=1e9;cnt.forEach((v,i)=>{if(v>0&&okc(i,v-1)&&per(i,v)<bw){bw=per(i,v);bi=i}});if(bi<0)break;cnt[bi]--}
    if(cnt.reduce((a,b)=>a+b,0)!==n||!cnt.every((v,i)=>okc(i,v)))return false;
    const out=[];let bi=0;segs.forEach((g,i)=>{if(cnt[i]){const b=Math.floor(L[i]/cnt[i]/10)*10;for(let j=0;j<cnt[i];j++){const m=bx[bi++];m.w=j===cnt[i]-1?L[i]-b*(cnt[i]-1):b;out.push(m)}}else if(L[i]>0)out.push(gap(L[i],{doorFill:true}));if(g.q)out.push(gap(g.q.e-g.q.s,{doorGap:true}))});
    while(out.length&&out[out.length-1].t==="gap"&&(out[out.length-1].doorFill||out[out.length-1].doorGap))out.pop();
    ms.splice(0,ms.length,...out);c.rest=0;c.err=false;return true}
  const end=c.align==="end",flip=q=>end?q.map(z=>({s:len-z.e,e:len-z.s})).reverse():q,spans=flip(sp);
  const finish=(out,x)=>{if(end){out.reverse();if(len-x>0)out.unshift(gap(len-x,{autoRest:true}))}ms.splice(0,ms.length,...out);return true};
  if(how==="flow"||how==="force"){const mods=ms.filter(m=>!m.autoRest),seq=end?mods.slice().reverse():mods;const out=[];let x=0;
    for(const m of seq){const w=+m.w||0;if(hard(m))for(const q of spans){if(x<q.e-1&&x+w>q.s+1){out.push(gap(q.e-x,{doorGap:true}));x=q.e}}out.push(m);x+=w}
    if(x>len+1&&how!=="force")return false;return finish(out,x)}
  if(how==="fit"){/* första lediga plats: boxar och rum läggs i den första del av väggen där de får plats, i ordning */
    const hs=ms.filter(hard),seq=end?hs.slice().reverse():hs,segs=[];let a=0;spans.forEach(q=>{segs.push({a,b:q.s,q,items:[],used:0});a=q.e});segs.push({a,b:len,q:null,items:[],used:0});
    for(const m of seq){const w=+m.w||0,g=segs.find(g=>g.b-g.a-g.used>=w-1);if(!g)return false;g.items.push(m);g.used+=w}
    const out=[];let x=0;segs.forEach(g=>{g.items.forEach(m=>{out.push(m);x+=+m.w||0});if(g.q){const fill=g.q.s-x;out.push(gap(fill+(g.q.e-g.q.s),{doorGap:true}));x=g.q.e}});
    while(out.length&&out[out.length-1].t==="gap"&&out[out.length-1].doorGap){x-=out[out.length-1].w;out.pop()}return finish(out,x)}
  return false}
/* v163: dörrens tillåtna zon. Långsida: mellan gavelraderna (hörnet bakom en gavelbox leder ingenstans).
   Gavel: mot stallgången, mellan långsidornas rader. Ligger en dörr utanför (t.ex. efter att en gavelbox lagts till) flyttas den in så lite som möjligt. */
function doorZone(dr,k,w){if(k==="N"||k==="S"){const ro=rowOff(dr);return {lo:ro.a,hi:dr.L-ro.b-w}}const g=gableSpan(dr,k);return {lo:g.y0,hi:g.y1-w}}
function doorFit(dr,k){(dr.doors||[]).filter(d=>d.k===k).forEach(d=>{const z=doorZone(dr,k,+d.w||0);if(z.hi<z.lo)return;const p0=+d.p||0,p1=Math.max(z.lo,Math.min(z.hi,p0));if(Math.abs(p1-p0)>1){d.p=Math.round(p1);S.doorClamped=(S.doorClamped||0)+1}})}
{const _dc=doorClamp;doorClamp=function(dr,k,p,w){const v=_dc(dr,k,p,w);try{const z=doorZone(dr,k,+w||0);if(z.hi>=z.lo){const q=Math.max(z.lo,Math.min(z.hi,v));if(Math.abs(q-v)>1)S.doorClamped=(S.doorClamped||0)+1;return q}}catch(_){}return v}}
/* v163: när djupet på en rad ändras (knapp eller blått handtag) måste gavlarna och gaveldörrarna följa med */
function settleGables(dr){if(!dr)return;const ro0=JSON.stringify(rowOff(dr));["N","S","W","E"].forEach(k=>doorFit(dr,k));["W","E"].forEach(k=>{try{autoFill(dr,k)}catch(_){}});if(JSON.stringify(rowOff(dr))!==ro0)autoAll(dr)}
{const _sbd=setBoxD;setBoxD=function(k,v){_sbd(k,v);try{settleGables(D.drawing);saveD();wizRefresh()}catch(_){}}}
{const _ed163=enableDrag;enableDrag=function(host,getDr,onLive,onEnd){_ed163(host,getDr,onLive,onEnd);if(!host)return;const pu=host.onpointerup,pd=host.onpointerdown;let fr=false;
  host.onpointerdown=e=>{fr=!!(e.target.closest&&e.target.closest("[data-rsfront],[data-rsouter]"));return pd&&pd.call(host,e)};
  host.onpointerup=e=>{const r=pu&&pu.call(host,e);if(fr){fr=false;try{const dr=getDr();settleGables(dr);saveD();cfgPanelRefresh()}catch(_){}}return r}}}
/* v163: autoAll räknar om tills rader och gavlar är överens (gavlarnas boxar påverkar var långsidorna börjar och tvärtom) */
{const _aa=autoAll;autoAll=function(dr){for(let g=0;g<4;g++){const key=()=>JSON.stringify([rowOff(dr),gableSpan(dr,"W"),gableSpan(dr,"E")]);const k0=key();_aa(dr);if(key()===k0)break}}}
const _af163=autoFill;autoFill=function(dr,k){const ms=dr.walls[k]=dr.walls[k]||[];doorFit(dr,k);for(let i=ms.length-1;i>=0;i--)if(ms[i].doorGap||ms[i].doorFill)ms.splice(i,1);
  const c=dr.cfg?.[k];const base=wallBase(dr,k),len=wallLen2(dr,k);const clean=()=>{for(let i=ms.length-1;i>=0;i--)if(ms[i].doorGap||ms[i].doorFill)ms.splice(i,1)};
  const after=()=>{if((k==="N"||k==="S")&&(dr.doors||[]).some(d=>d.k==="W"||d.k==="E")){const n0=S.doorClamped||0;doorFit(dr,"W");doorFit(dr,"E")}};
  if(!c||!c.auto||!(c.n>0)){_af163(dr,k);const sp0=doorSpans(dr,k,base,len);if(sp0.length&&ms.some(m=>m.t==="box"||m.t==="room")){clean();const cc={...(c||{}),mode:"per"};for(const h of ["flow","fit","force"])if(doorPlace(dr,k,ms,sp0,len,cc,h))break}after();return}
  const sp=doorSpans(dr,k,base,len);if(!sp.length){_af163(dr,k);after();return}
  const tot=sp.reduce((a,q)=>a+q.e-q.s,0);S.doorDrop=S.doorDrop||0;const n0=c.n;
  for(let g=0;g<30;g++){const ph={id:uid2(),t:"gap",w:tot,doorGap:true};ms.push(ph);_af163(dr,k);const pi=ms.indexOf(ph);if(pi>=0)ms.splice(pi,1);clean();
    if(!ms.some(m=>m.t==="box"||m.t==="room")){after();return}
    if(doorPlace(dr,k,ms,sp,len,c,"lika")||doorPlace(dr,k,ms,sp,len,c,"flow")||doorPlace(dr,k,ms,sp,len,c,"fit"))break;
    if(c.n<=0){doorPlace(dr,k,ms,sp,len,c,"force");break}c.n--;S.doorDrop++}
  if(c.n<n0&&typeof toast==="function"&&!S.noDoorToast){clearTimeout(S.ddT);const nm=(typeof WALL_NAMES!=="undefined"&&WALL_NAMES[k])||k;S.ddT=setTimeout(()=>{try{toast(c.n?`${nm}: ${c.n} ${c.n===1?"box":"boxar"} får plats vid sidan av ingången`:`Det får inte plats någon box på ${String(nm).toLowerCase()} vid sidan av ingången`)}catch(_){}},90)}
  after()};
